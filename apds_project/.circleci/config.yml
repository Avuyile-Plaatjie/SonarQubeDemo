version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.0

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: npm install

      - run:
          name: Build app
          command: npm run build

      - run:
          name: Run SonarQube Scan
          command: |
            npm install -g sonarqube-scanner
            sonar-scanner \
              -Dsonar.projectKey=securepay \
              -Dsonar.sources=. \
              -Dsonar.host.url=http://localhost:9000 \
              -Dsonar.login=$SONAR_TOKEN

workflows:
  version: 2
  build_and_scan:
    jobs:
      - build