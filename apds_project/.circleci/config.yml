version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:18.20

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            cd apds_project
            npm install

      - run:
          name: Build app
          command: |
            cd apds_project
            npm run build

      - run:
          name: Install Sonar Scanner
          command: npm install -g sonarqube-scanner

      - run:
          name: Run SonarCloud Scan
          command: |
            cd apds_project
            sonar-scanner \
              -Dsonar.projectKey=Avuyile-Plaatjie_SonarQubeDemo \
              -Dsonar.organization=avuyile-plaatjie \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.token=$SONAR_TOKEN

workflows:
  version: 2

  build_and_scan:
    jobs:
      - build